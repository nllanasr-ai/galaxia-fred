<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galaxia 3D en movimiento</title>
  <style>
    html, body { margin:0; padding:0; overflow:hidden; background:#03040a; }
    canvas { display:block; }
    .hint{
      position:fixed; left:16px; top:16px; color:#b9c6ff; 
      font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background:rgba(0,0,0,.35); padding:10px 12px; border-radius:12px;
      border:1px solid rgba(185,198,255,.25);
      font-size:14px;
      user-select:none;
    }
    .love-message {
      position: fixed;
      left: 50%;
      bottom: 8%;
      transform: translateX(-50%);
      width: min(90vw, 620px);
      padding: 18px 24px;
      text-align: center;
      color: #fff4fc;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: rgba(15, 8, 38, .72);
      border: 1px solid rgba(255, 190, 240, .7);
      border-radius: 22px;
      box-shadow: 0 0 28px rgba(213, 99, 255, .38);
      pointer-events: none;
    }
    .love-message h1 { margin: 0 0 6px; font-size: clamp(28px, 6vw, 48px); }
    .love-message p { margin: 0; color: #ffd2f2; font-size: clamp(16px, 3vw, 22px); }
  </style>
</head>
<body>
  <div class="hint">🪐 Galaxia 3D • Arrastra para girar • Rueda para acercar la foto</div>
  <div class="love-message">
    <h1>Te amo Fredy 💖</h1>
    <p>✨ Eres mi universo 🌌💕</p>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
    import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";

    // --- Escena / cámara / renderer ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x03040a, 0.02);

    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      2000
    );
    camera.position.set(0, 6, 24);

    const renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // Controles
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 5;
    controls.maxDistance = 58;

    // --- Luz ---
    const ambient = new THREE.AmbientLight(0x6b79ff, 0.35);
    scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
    dirLight.position.set(10, 12, 8);
    scene.add(dirLight);

    // --- Galaxia: campo de estrellas en espiral ---
    const starCount = 5000;
    const positions = new Float32Array(starCount * 3);

    for (let i = 0; i < starCount; i++) {
      // índice aleatorio
      const t = i / starCount;

      // radio (más denso al centro)
      const radius = Math.pow(Math.random(), 0.35) * 18;

      // ángulo con “espiral”
      const angle = t * Math.PI * 18 + (Math.random() - 0.5) * 0.8;

      // altura pequeña
      const y = (Math.random() - 0.5) * 2.2;

      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;

      positions[i * 3 + 0] = x;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 2] = z;
    }

    const starGeom = new THREE.BufferGeometry();
    starGeom.setAttribute("position", new THREE.BufferAttribute(positions, 3));

    // Material con color y brillo
    const starMat = new THREE.PointsMaterial({
      color: 0xb8c6ff,
      size: 0.06,
      sizeAttenuation: true,
      transparent: true,
      opacity: 0.95,
      depthWrite: false
    });

    const stars = new THREE.Points(starGeom, starMat);
    scene.add(stars);

    // --- Núcleo brillante ---
    const core = new THREE.Mesh(
      new THREE.SphereGeometry(1.15, 48, 48),
      new THREE.MeshBasicMaterial({ color: 0xffe7a8 })
    );
    scene.add(core);
    core.add(new THREE.Mesh(
      new THREE.SphereGeometry(1.8, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0xffa8ef, transparent: true, opacity: 0.12, side: THREE.BackSide })
    ));
    const coreLight = new THREE.PointLight(0xffa8df, 2.2, 28);
    scene.add(coreLight);

    // --- Foto en una órbita 3D, para verla al acercar con la rueda ---
    const photoOrbitRadius = 10.8;
    const photoOrbit = new THREE.Mesh(
      new THREE.TorusGeometry(photoOrbitRadius, 0.025, 6, 180),
      new THREE.MeshBasicMaterial({ color: 0xffa8e8, transparent: true, opacity: 0.35 })
    );
    photoOrbit.rotation.x = Math.PI / 2;
    scene.add(photoOrbit);

    function roundedCardShape(width, height, radius) {
      const shape = new THREE.Shape();
      const x = width / 2;
      const y = height / 2;
      shape.moveTo(-x + radius, -y);
      shape.lineTo(x - radius, -y);
      shape.quadraticCurveTo(x, -y, x, -y + radius);
      shape.lineTo(x, y - radius);
      shape.quadraticCurveTo(x, y, x - radius, y);
      shape.lineTo(-x + radius, y);
      shape.quadraticCurveTo(-x, y, -x, y - radius);
      shape.lineTo(-x, -y + radius);
      shape.quadraticCurveTo(-x, -y, -x + radius, -y);
      return shape;
    }

    const photoCard = new THREE.Group();
    photoCard.add(new THREE.Mesh(
      new THREE.ShapeGeometry(roundedCardShape(2.65, 4.55, 0.2)),
      new THREE.MeshBasicMaterial({ color: 0xffa9e7, side: THREE.DoubleSide })
    ));
    const photoPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(1, 1),
      new THREE.MeshBasicMaterial({ color: 0x24112f, side: THREE.DoubleSide })
    );
    photoPlane.position.set(0, 0.25, 0.015);
    photoCard.add(photoPlane);

    const captionCanvas = document.createElement("canvas");
    captionCanvas.width = 512;
    captionCanvas.height = 96;
    const captionContext = captionCanvas.getContext("2d");
    captionContext.fillStyle = "#35133f";
    captionContext.fillRect(0, 0, 512, 96);
    captionContext.fillStyle = "#fff0fb";
    captionContext.font = "bold 42px Segoe UI, sans-serif";
    captionContext.textAlign = "center";
    captionContext.textBaseline = "middle";
    captionContext.fillText("NUESTRO AMOR  ♥", 256, 48);
    const captionTexture = new THREE.CanvasTexture(captionCanvas);
    captionTexture.colorSpace = THREE.SRGBColorSpace;
    const caption = new THREE.Mesh(
      new THREE.PlaneGeometry(2.35, 0.44),
      new THREE.MeshBasicMaterial({ map: captionTexture, transparent: true, side: THREE.DoubleSide })
    );
    caption.position.set(0, -1.93, 0.025);
    photoCard.add(caption);
    scene.add(photoCard);

    new THREE.TextureLoader().load("foto_fredy.jpg", (texture) => {
      texture.colorSpace = THREE.SRGBColorSpace;
      const aspect = texture.image.width / texture.image.height;
      const width = Math.min(2.35, 3.42 * aspect);
      const height = width / aspect;
      photoPlane.scale.set(width, height, 1);
      photoPlane.material.map = texture;
      photoPlane.material.color.set(0xffffff);
      photoPlane.material.needsUpdate = true;
    });

    // --- Texturas procedurales para superficies planetarias detalladas ---
    function createPlanetTexture(palette, seed) {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 256;
      const context = canvas.getContext("2d");
      const base = context.createLinearGradient(0, 0, 0, 256);
      base.addColorStop(0, palette[0]);
      base.addColorStop(0.5, palette[1]);
      base.addColorStop(1, palette[2]);
      context.fillStyle = base;
      context.fillRect(0, 0, 512, 256);

      for (let band = 0; band < 13; band++) {
        const y = band * 22;
        context.beginPath();
        for (let x = 0; x <= 512; x += 16) {
          const wave = Math.sin(x / 42 + band * 1.35 + seed) * (5 + (band % 3) * 3);
          if (x === 0) context.moveTo(x, y + wave);
          else context.lineTo(x, y + wave);
        }
        for (let x = 512; x >= 0; x -= 16) {
          context.lineTo(x, y + 22 + Math.sin(x / 48 + band * 1.7 + seed) * 5);
        }
        context.closePath();
        context.globalAlpha = band % 2 === 0 ? 0.46 : 0.27;
        context.fillStyle = palette[(band + 1) % palette.length];
        context.fill();
      }
      context.globalAlpha = 0.48;
      for (let spot = 0; spot < 5; spot++) {
        const x = (spot * 103 + seed * 37) % 512;
        const y = 35 + ((spot * 47 + seed * 19) % 180);
        context.beginPath();
        context.ellipse(x, y, 12 + (spot % 3) * 6, 5 + (spot % 2) * 4, -0.2, 0, Math.PI * 2);
        context.fillStyle = palette[(spot + 2) % palette.length];
        context.fill();
      }
      context.globalAlpha = 1;
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    function makePlanet(planet) {
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(planet.radius, 48, 48),
        new THREE.MeshStandardMaterial({
          map: createPlanetTexture(planet.palette, planet.seed),
          roughness: 0.48,
          metalness: 0.08,
          emissive: planet.emissive,
          emissiveIntensity: 0.12
        })
      );
      mesh.add(new THREE.Mesh(
        new THREE.SphereGeometry(planet.radius * 1.09, 32, 32),
        new THREE.MeshBasicMaterial({ color: planet.emissive, transparent: true, opacity: 0.12, side: THREE.BackSide })
      ));
      return mesh;
    }

    const planets = [
      { radius: 0.55, orbitR: 4.8, speed: 0.48, tilt: 0.24, seed: 1, emissive: 0x55cfff, palette: ["#a5f3ff", "#1688c9", "#08285d"], ring: false },
      { radius: 0.42, orbitR: 6.7, speed: 0.38, tilt: 0.48, seed: 2, emissive: 0xff65d7, palette: ["#ffd0f5", "#da4eaa", "#591b72"], ring: true },
      { radius: 0.78, orbitR: 8.8, speed: 0.29, tilt: 0.16, seed: 3, emissive: 0xffbf65, palette: ["#ffe9ad", "#d87439", "#58243d"], ring: true },
      { radius: 0.58, orbitR: 11.2, speed: 0.24, tilt: 0.36, seed: 4, emissive: 0xb08aff, palette: ["#e1c9ff", "#7951d4", "#25245f"], ring: false },
      { radius: 0.72, orbitR: 13.8, speed: 0.19, tilt: 0.12, seed: 5, emissive: 0x5dffdc, palette: ["#c5ffdf", "#24aa91", "#06475f"], ring: true },
      { radius: 0.48, orbitR: 16.4, speed: 0.16, tilt: 0.31, seed: 6, emissive: 0xff8390, palette: ["#ffd1c8", "#db596e", "#692b60"], ring: false },
      { radius: 0.88, orbitR: 19.2, speed: 0.13, tilt: 0.2, seed: 7, emissive: 0x70aaff, palette: ["#c2e9ff", "#477aca", "#171e64"], ring: true },
    ];

    planets.forEach((p) => {
      const pivot = new THREE.Object3D();
      pivot.rotation.z = p.tilt;
      scene.add(pivot);
      p.pivot = pivot;
      p.mesh = makePlanet(p);
      p.mesh.position.set(p.orbitR, 0, 0);
      pivot.add(p.mesh);

      if (p.ring) {
        const ring = new THREE.Mesh(
          new THREE.RingGeometry(p.radius * 1.25, p.radius * 1.85, 80),
          new THREE.MeshBasicMaterial({ color: p.emissive, transparent: true, opacity: 0.62, side: THREE.DoubleSide })
        );
        ring.rotation.x = Math.PI / 2;
        p.mesh.add(ring);
      }
    });

    // --- Animación ---
    let time = 0;
    function animate() {
      requestAnimationFrame(animate);

      time += 0.01;

      // Girar galaxia lentamente y mantener la foto en movimiento orbital.
      stars.rotation.y += 0.0008;
      stars.rotation.x += 0.0002;
      const photoAngle = time * 0.32;
      photoCard.position.set(
        Math.cos(photoAngle) * photoOrbitRadius,
        Math.sin(photoAngle * 0.7) * 1.3,
        Math.sin(photoAngle) * photoOrbitRadius
      );
      photoCard.lookAt(camera.position);

      // Mover un poquito las partículas como “vibración”
      const pos = stars.geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const ix = i * 3;
        // micro movimiento
        pos.array[ix + 1] += Math.sin(time + i * 0.02) * 0.00008;
      }
      pos.needsUpdate = true;

      // Núcleo pulsa
      core.scale.setScalar(1 + Math.sin(time * 1.6) * 0.03);

      // Órbitas planetas
      planets.forEach((p, idx) => {
        p.pivot.rotation.y += p.speed * 0.005;
        p.mesh.rotation.y += 0.006 + idx * 0.001;
        // un toque extra
        p.pivot.rotation.x = Math.sin(time * 0.7 + idx) * 0.05;
      });

      renderer.render(scene, camera);
    }

    animate();

    // --- Resize ---
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

  </script>
</body>
</html>
